kind = "web"
previewPath = "/"
title = "Six6 Labs"
version = "1.0.0"
id = "artifacts/six6-labs"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21966

[services.development]
run = "pnpm --filter @workspace/six6-labs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/six6-labs", "run", "build" ]
publicDir = "artifacts/six6-labs/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21966"
BASE_PATH = "/"
